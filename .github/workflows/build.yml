name: Build

on:
  workflow_call:
    inputs:
      version_suffix:
        required: false
        type: string
        default: ''
        description: 'Appended to Cargo.toml version (e.g. "-nightly.20260728.abc1234")'

env:
  SHELL_HELP_DIR: shell_help

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: deref-x86_64-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: deref-x86_64-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: deref-aarch64-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: deref-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: deref-aarch64-macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: deref-x86_64-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (musl build)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Override version for nightly
        if: inputs.version_suffix != ''
        shell: bash
        run: |
          CURRENT=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          NEW="${CURRENT}${{ inputs.version_suffix }}"
          sed -i.bak "1,/^version = /s/^version = \".*\"/version = \"${NEW}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          echo "Build version: ${NEW}"

      - name: Build (native)
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (musl via cross)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          staging="${{ matrix.asset }}"
          mkdir -p "$staging" artifacts

          # 复制二进制文件
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/deref.exe" "$staging/"
          else
            cp "target/${{ matrix.target }}/release/deref" "$staging/"
          fi

          # 复制 shell 补全和 man 手册页（如果存在）
          cp -r ${SHELL_HELP_DIR}/* "$staging/" 2>/dev/null || true

          # 复制 README 和 LICENSE
          cp README.md LICENSE "$staging/" 2>/dev/null || true

          # 打包为 tar.gz
          tar czf "artifacts/$staging.tar.gz" "$staging"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: artifacts/${{ matrix.asset }}.tar.gz
